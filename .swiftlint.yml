disabled_rules:
  - trailing_whitespace
  - line_length
  - todo
  - identifier_name

opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - vertical_whitespace_opening_braces

included:
  - NuLink
excluded:
  - Pods

reporter: "xcode"

# Regras suaves para começar
cyclomatic_complexity:
  warning: 12
  error: 18

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 400
  error: 800

